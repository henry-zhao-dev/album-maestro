[project]
name = "yt-maestro"
version = "0.1.0"
description = "Declarative YouTube music processor tailored for classical music recordings"
authors = [
    {name = "Henry Zhao",email = "75873192+henry-zhao-dev@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp (>=2026.7.4,<2027.0.0)"
]

[project.scripts]
yt-maestro = "yt_maestro.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
