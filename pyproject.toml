[project]
name = "album-maestro"
version = "0.1.0"
description = "Build organized music libraries from declarative JSON catalogs"
authors = [
    {name = "Henry Zhao",email = "75873192+henry-zhao-dev@users.noreply.github.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp (>=2026.8.19,<2027.0.0)",
    "jsonschema (>=4.26.0,<5.0.0)"
]

[project.scripts]
album-maestro = "album_maestro.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
